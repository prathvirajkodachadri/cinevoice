[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cinevoice-web-backend"
version = "0.1.0"
description = "CineVoice AI enhancement web API and deterministic audio engine"
requires-python = ">=3.11,<3.14"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.11,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "soundfile>=0.12,<1"
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/cinevoice", "src/cinevoice_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
