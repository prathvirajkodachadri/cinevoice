services:
  cinevoice:
    build:
      context: .
      args:
        INSTALL_AI: "1"
    ports:
      - "8080:8080"
    environment:
      CINEVOICE_MAX_UPLOAD_MB: "250"
      CINEVOICE_MAX_DURATION_SECONDS: "3600"
      CINEVOICE_RETENTION_HOURS: "24"
      CINEVOICE_MAX_CONCURRENT_JOBS: "2"
      CINEVOICE_REQUIRE_AI: "0"
    volumes:
      - cinevoice-jobs:/app/data/jobs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G

volumes:
  cinevoice-jobs:
